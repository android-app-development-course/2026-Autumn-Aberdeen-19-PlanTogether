server:
  port: 8080

spring:
  application:
    name: plantogether-backend
  datasource:
    # H2 文件数据库（PostgreSQL 兼容模式，方便日后无缝切换到 PostgreSQL）
    url: jdbc:h2:file:./data/plantogether;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      # 开发期自动建表；上线前改用 Flyway 迁移脚本
      ddl-auto: update
    open-in-view: false

app:
  jwt:
    # 生产环境务必替换为足够长的随机密钥（>=32 字节）
    secret: "PLANTOGETHER_DEV_SECRET_KEY_CHANGE_ME_BEFORE_PRODUCTION_2026_1024_BITS"
    expiration-ms: 86400000  # 24 小时

  amap:
    # 高德「Web服务」类型的 Key，用于搜索餐厅/地点的评分、人均、营业时间。
    # 申请：https://lbs.amap.com/api/webservice/create-project-and-key
    # 不要写在这里提交到仓库 —— 用环境变量传入：
    #   Windows PowerShell: $env:PLANTOGETHER_AMAP_KEY="你的key"; gradle bootRun
    # 留空时相关功能整体隐身，不影响其他功能。
    key: ${PLANTOGETHER_AMAP_KEY:}
    # 一般不用改。留这个开关是为了本地联调：把这个地址指到自己的假响应服务，
    # 就能在不消耗高德配额的前提下验证解析和 UI。
    endpoint: ${PLANTOGETHER_AMAP_ENDPOINT:https://restapi.amap.com/v5/place/text}
